# Copy this file to config.yaml and fill it in. config.yaml is git-ignored.

# Your Sleeper username (not your email).
sleeper_username: your_sleeper_username

# From your league URL: https://sleeper.com/leagues/<league_id>/...
# Keep the quotes -- it's a long number that must stay a string.
league_id: "123456789012345678"

# Tried in order. After each move the rosters are re-checked, so later moves see
# the result of earlier ones.
moves:
  - add: Joe Flacco
    drop: Deshaun Watson

  # Disambiguate players who share a name with team/position, or use the Sleeper id.
  - add: { name: Josh Allen, position: QB }
    drop: { id: "4034" }

  # No drop: only works if you have an open roster spot.
  # - add: Tank Bigsby

settings:
  headless: true               # false shows the browser window
  retry_minutes: 0             # keep retrying for this long, e.g. 30 if you start before waivers clear
  retry_interval_seconds: 30
  verify_timeout_seconds: 60   # how long to wait for the roster change to show in Sleeper's API
  screenshots: true            # saves screenshots of each step to screenshots/
  auth_file: .auth/state.json  # saved login session (created by `python -m sleeper_bot login`)

# If Sleeper changes its website and the bot can't find a button, override the
# CSS selectors / text patterns here. See DEFAULT_SELECTORS in sleeper_bot/browser.py.
# selectors:
#   add_button: 'button[aria-label="Add player"]'
